name: Publish to Firebase Hosting

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "public/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "vite.config.js"
      - "firebase.json"
      - ".github/workflows/firebase-hosting-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies and build
        run: npm ci && npm run build

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEEP_CONVERSATIONS_501618 }}

      - name: Deploy to Firebase Hosting
        env:
          FIREBASE_DEPLOY_MESSAGE: ${{ github.event.head_commit.message || github.sha }}
        run: >-
          npx --yes firebase-tools@15.22.4 deploy
          --only hosting
          --project deep-conversations-501618
          --message "$FIREBASE_DEPLOY_MESSAGE"
